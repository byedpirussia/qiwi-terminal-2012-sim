<html>
<head>
	<title>send mail and return</title>
	<meta http-equiv="content-type" content="text/html; charset=windows-1251">
	<meta http-equiv="pragma" content="no-cache">
	
	
</head>

<script src="../../js/engine/utils.js?{VERSION}" type="text/javascript"></script>
<script src="../../js/engine/storage.js?{VERSION}" type="text/javascript"></script>
<script src="../../func/ui/objects.js"></script>
<script src="../../func/engine/pars_cookie.js"></script>
<script>

function GetDateTimeString()
{
    var dat = new Date();
    var nMonth = 1 + dat.getMonth();
    var strDate =  dat.getDate() + "." + nMonth + "." + dat.getFullYear() + "," + dat.getHours() + ":" + dat.getMinutes() + ":" + dat.getSeconds();
    return strDate;
}

function start()
{
	var lang = storage.get("language");
    document.getElementById('EmbedParams').value = lang;
    document.getElementById('_extra_MGT_date').value = GetDateTimeString();
    document.getElementById('sendvo').submit();
}

</script>
<body onload="start();">
    <form id="sendvo" name="sendvo" action="./return.html" method="post">
        <input type="hidden" id="prv_id" name="prv_id" value="5548" />
        <input type="hidden" id="prv_name" name="prv_name" value="MPKCELL" />
        <input type="hidden" id="getAccountNumber" name="getAccountNumber" value="MPKCELL" />
        <input type="hidden" id="_extra_fake_provider" name="_extra_fake_provider" value="true" />
        <input type="hidden" id="_extra_result_int_page" name="_extra_result_int_page" value="return.html" />
        <input type="hidden" id="_extra_no_print_check" name="_extra_no_print_check" value="true" />
        <input type="hidden" id="_extra_MGT_date" name="_extra_MGT_date" value="true" />
        <input type="hidden" id="EmbedParams" name="EmbedParams" value="" />
    </form>
</body>
</html>
