<script type="text/javascript">

function init()
{

       var sLang = storage.get("language");
       if(sLang == "rus")
       {
       document.getElementById('btn_back').style.display = "block";
       document.getElementById('btn_menu').style.display = "block";       
       }
       else {
       document.getElementById('btn_back_kaz').style.display = "block";
       document.getElementById('btn_menu_kaz').style.display = "block";
       }
    $("banner").innerHTML = getFlashDef("./swf/banner.swf");
    new CInnerShadow($('btn_left'), { color: 30 });
	new CInnerShadow($('btn_center'), { saturation: 1, brightness: 200 });
};

function onPrvClick(id, sName, type)
{
    storage.put("changePrvId", id, "true");
    storage.put("changePrvName", sName, "true");
	if(type == "other")
	{
		location = "./change_oth.html";
	}
	else if(type== "cellular")
	{
		location = "./change_cel.html";
	}	
};

function onBackBtnClick()
{
    var oPayInfo = Object.deserialize(storage.get("pay_info"));
		
    if (oPayInfo != null || oPayInfo != "undefined") {
        storage.put("provider", oPayInfo.prvId);
        storage.put("pay_info", "null");
        document.location.href = "./provider.html";
    }
    else
        document.location.href = "./main.html";  
};

function onForwardBtnClick()
{
    var oPayInfo = Object.deserialize(storage.get("pay_info"));
	
	
	
    if (oPayInfo != null || oPayInfo != "undefined") {
        storage.put("provider", oPayInfo.prvId);
		ff._extra_fixed_int_summ.value = 0;
		ff.submit();
        document.location.href = "./validate_confirm.html";
    }
    else
        document.location.href = "./main.html";  
};


function onMenuBtnClick()
{
    document.location.href = "./index.html";
};
</script>
