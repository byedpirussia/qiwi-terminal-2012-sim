<html>
<head>
	<title>Validate_Confirm</title>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<meta http-equiv="pragma" content="no-cache" />
	<meta http-equiv="refresh" content="180; URL=./terminal.html" />
	<link rel="stylesheet" href="./css/validate_confirm.css" type="text/css" />
	<script type="text/javascript" src="./js/engine/utils.js"></script>
	<script type="text/javascript" src="./js/engine/base.js"></script>
	<script type="text/javascript" src="./js/engine/storage.js"></script>
	<script type="text/javascript" src="./js/engine/advert.js"></script>
	<script type="text/javascript" src="./advert_content.js"></script>
	<script type="text/javascript" src="./advert_content_kz.js"></script>
	<script type="text/javascript" src="./js/engine/hyphen.js"></script>
		<script src="./js/lang/str_rus.js"></script>
    <script src="./js/lang/str_kaz.js"></script>
	<script type="text/javascript">
        var g_sPrvType = '',
            logo;
function init() {        
       var sLang = storage.get("language");
       if(sLang == "rus"){
       $("btn_left_rus").style.display = "block";
       $("btn_center_rus").style.display = "block";
       $("btn_right_rus").style.display = "block";
       document.getElementById('title').innerHTML = 'Подтвердите правильность введенных данных';
       }
       else {
       $("btn_left_kaz").style.display = "block";
       $("btn_center_kaz").style.display = "block";
       $("btn_right_kaz").style.display = "block";
       document.getElementById('title').innerHTML = 'Енгізілген ақпараттың дұрыстығын растаңыз';      
       }   
            var oPayInfo = Object.deserialize(storage.get("pay_info"));
            logo = $("logo");
            logo.img = logo.getElementsByTagName('div')[0];
            logo.alt = logo.getElementsByTagName('p')[0];

            if($isNoU(oPayInfo))
            {
                document.location.href = "./terminal.html";
            }
            displayPayInfo(oPayInfo);
            storage.put("pay_info", oPayInfo.serialize());
            startAdvert("Validate_Confirm");
            
             var sLang = storage.get("language");

		new CInnerShadow($('btn_left_rus').getElementsByTagName('img')[0], { color: 30 });
		new CInnerShadow($('btn_center_rus').getElementsByTagName('img')[0], { saturation: 1, brightness: 200 });
		new CInnerShadow($('btn_right_rus').getElementsByTagName('img')[0], { color: 30 });
		new CInnerShadow($('btn_left_kaz').getElementsByTagName('img')[0], { color: 30 });
		new CInnerShadow($('btn_center_kaz').getElementsByTagName('img')[0], { saturation: 1, brightness: 200 });
		new CInnerShadow($('btn_right_kaz').getElementsByTagName('img')[0], { color: 30 });
        }
        function displayPayInfo(oInfo) {
            var aInnPhone = [];
            if (isCorrect(oInfo.account)) {
                if (isCorrect(oInfo.isCellular)) {
                    if (oInfo.isCellular == "true") {
                        g_sPrvType = oInfo.isCharity ? 'CHARITY' : 'CELLULAR';
						//---------Activ,Kcell---------
						g_sPrvType = oInfo.isGsm ? 'GSM' : g_sPrvType;
						//---------Activ,Kcell---------
                        if(g_sPrvType == 'CHARITY' && oInfo.account == '0000000000')
                        {
                        	onMenuBtnClick('FORWARD');
                        	return;
                        }
                        oInfo.account =
                            "8(" + oInfo.account.substr(0, 3) + ")" +
                            oInfo.account.substr(3, 3) + "-" +
                            oInfo.account.substr(6, 2) + "-" +
                            oInfo.account.substr(8, 2);
                    }
                    else if (oInfo.isCellular == "false") {
                        g_sPrvType = "OTHER";
                    }
                }
                $("field_inp").value = oInfo.account;    
            }
            else {
                document.location.href = "./terminal.html";    
            }           
            if (isCorrect(oInfo.prvLogo) && oInfo.prvLogo != "null.gif") {
                logo.img.style.backgroundImage = "url('./img/ui_item/" + getFileName(oInfo.prvLogo) + "')";
                if (isCorrect(oInfo.prvName)) {
                    logo.alt.innerHTML = autohyphen.hyphenizeText(oInfo.buttonName || oInfo.prvName);
                }
            }
            else if (g_sPrvType == "CELLULAR") {
                logo.img.style.backgroundImage = "url('./img/ui/cellular.gif')";
            }
            else if (isCorrect(oInfo.prvName)) {
                var oLogoDiv = $("logo_bg");
                oLogoDiv.innerHTML = 
                    '<table width="100%" height="100%">' +
                    '  <tr><td align="center" valign="middle">' + oInfo.prvName + '</td></tr>' +
                    '</table>';
            }
            logo.alt.style.marginTop = (logo.alt.parentNode.clientHeight - logo.alt.clientHeight) / 2 + 'px';
        }

 function displayAlertMsg(sInfo) {
            if (isCorrect(sInfo)) {
                var sAlertContent =
                    '<div class="alert" style="left: ' + (screen.width - 801) / 2 + 'px; top: ' + (screen.height - 482) / 2 + 'px;">' +
                    '  <div class="alert_header">Внимание</div>' +
                    '  <div class="alert_msg">' + sInfo + '</div>' +
                    '  <div class="alert_footer">Если Вы согласны, нажмите «ВПЕРЕД» для оплаты<br />или нажмите «НА ГЛАВНУЮ» для отмены операции</div>' +
                    '</div>';
                document.body.innerHTML += sAlertContent;    
            }
        } 

function isCorrect(s) {
            return (!$isNoU(s) && s.is(String) && s.length > 0);
        }

function onMenuBtnClick(sBtn) {
        var sLang = storage.get("language");
        
            var sAlertMsg = $("payment_info").value;
            switch (sBtn) {
                case "BACKWARD":
                    if (g_sPrvType == "CHARITY") {
                    	document.location.href = "./charity.html"; 	
                    }
                    else if (g_sPrvType == "CELLULAR") {
                        storage.put("provider", "null");
                        document.location.href = "./cellular.html";                     
                    }
					//---------Activ,Kcell---------
					else if (g_sPrvType == "GSM") {
					    document.location.href = "./cellular.gsm.html";                     
                    }
					//---------Activ,Kcell---------
                    else if (g_sPrvType == "OTHER") {
                        document.location.href = "./provider.html";                 
                    }
                    else {
                        document.location.href = "./main.html";                     
                    }
                    storage.put("pay_info", "null");
                    break;
                case "MENU":
                    document.location.href = "./terminal.html";                
                    storage.put("pay_info", "null");
                    break;
                case "FORWARD":
                    if (sAlertMsg.length > 0) {
                        $("payment_info").value = "";
                        displayAlertMsg(sAlertMsg);
                    }
                    document.location.href = "./enter_summ.html";
                    break;
            }            
        }
</script>
</head>
<body onload="init();">
<div><script type="text/javascript">document.write(getStr("sound_validate"));</script></div>
<div id="content">
    <div id="container1">
        <div id="qiwi_logo"><img alt="" src="./img/ui/qiwicel.gif" /></div>
        <div id="advert_1"></div>
    </div>
    <div id="work_place">
        <div  id="container2" align="center">
        <div id="title" style="	 font-size: 30px;font-weight: bold;color: #2268c6;"></div>
		<div id="container3">
			<div id="field_txt"><input id="field_inp" name="field_inp" value="" /></div>
			<div class="provider-button" id="logo" style="background-image: url('./img/ui/vc/logo3.gif')">
				<div></div><p></p>
                       </div>
		</div>
        </div>
        <div id="sys_info">
            <form id="ff" name="ff" method="post" action="#">
                <input id="payment_info" name="payment_info" type="hidden" value="" />
                <!--<input id="alert" name="alert" class="msg" type="text" value="0" />-->
                <input id="ahtung_printer1" name="ahtung_printer1" class="msg" type="text" value="" />
                <input id="ahtung_printer2" name="ahtung_printer2" class="msg" type="text" value="" />
                <input id="ahtung_printer3" name="ahtung_printer3" class="msg" type="text" value="" />
            </form>
        </div>
        <div id="advert_2"></div>
    </div>
    <div id="bottom_menu">
        <div id="btn_left_rus" style="display:none;" class="bottom-button-left">
        <img alt=""  src="./img/ui/navigation/back_rus.gif";  onclick="onMenuBtnClick('BACKWARD'); " />
        </div>
        <div id="btn_left_kaz" style="display:none;" class="bottom-button-left">
        <img alt=""  src="./img/ui/navigation/back_kaz.gif";  onclick="onMenuBtnClick('BACKWARD'); " />
        </div>
        <div id="btn_center_rus" style="display:none;" class="bottom-button-center">
        <img alt=""  src="./img/ui/navigation/menu_rus.gif"; onclick="onMenuBtnClick('MENU');" />
        </div>
        <div id="btn_center_kaz" style="display:none;" class="bottom-button-center">
        <img alt=""  src="./img/ui/navigation/menu_kaz.gif"; onclick="onMenuBtnClick('MENU');" />
        </div> 
        <div id="btn_right_rus" style="display:none;" class="bottom-button-right">
        <img alt="" src="./img/ui/navigation/forward_rus.gif" onclick="onMenuBtnClick('FORWARD');" />
        </div>
        <div id="btn_right_kaz" style="display:none;" class="bottom-button-right">
        <img alt="" src="./img/ui/navigation/forward_kaz.gif" onclick="onMenuBtnClick('FORWARD');" />
        </div>     
    </div>
</div>
</body>
</html>
