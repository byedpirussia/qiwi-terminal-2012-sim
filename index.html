<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>QIWI Терминал — Проверка Ruffle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f2f4f7;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 44px;
            max-width: 520px;
            width: 90%;
            text-align: center;
            border-top: 6px solid #ff8c00;
        }
        .logo {
            font-size: 32px;
            font-weight: 800;
            color: #ff8c00;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #111827;
        }
        p {
            font-size: 15px;
            line-height: 1.5;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #ff8c00;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin: 6px;
            transition: background 0.2s;
        }
        .btn:hover { background: #e07b00; }
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }
        .btn-secondary:hover { background: #d1d5db; }
        .skip {
            display: block;
            margin-top: 18px;
            font-size: 13px;
            color: #6b7280;
            text-decoration: underline;
            cursor: pointer;
        }
        #status { display: block; }
        #missing { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">QIWI</div>
        <div id="status">
            <h1>Проверка браузера...</h1>
            <p>Проверяем наличие расширения Ruffle для запуска Flash-интерфейса терминала.</p>
        </div>
        <div id="missing">
            <h1>Требуется расширение Ruffle</h1>
            <p>Для корректной работы платёжного терминала QIWI (2012) необходимо установить расширение <b>Ruffle</b> (эмулятор Flash) в ваш браузер.</p>
            <a class="btn" href="https://ruffle.rs/#downloads" target="_blank" rel="noopener">Скачать Ruffle</a>
            <button class="btn btn-secondary" onclick="location.reload()">Проверить снова</button>
            <a class="skip" href="./terminal.html">Продолжить без Ruffle</a>
        </div>
    </div>

    <script>
        (function () {
            function hasRuffle() {
                return Boolean(window.RufflePlayer) ||
                    Array.from(navigator.plugins || []).some(function (p) {
                        return /ruffle|shockwave flash/i.test(p.name);
                    });
            }

            setTimeout(function () {
                if (hasRuffle()) {
                    window.location.replace("./terminal.html");
                } else {
                    document.getElementById("status").style.display = "none";
                    document.getElementById("missing").style.display = "block";
                }
            }, 500);
        })();
    </script>
</body>
</html>
