<script>
    function DigitsFormat(str) {
        str = str.replace(/\s+/g, '')
        return str.replace(/(\d)(?=(\d\d\d)+([^\d]|$))/g, '$1 ');
    }
    $(document).ready(function () {
        $('.nkeyboard_button').bind("click", function () {
            var o = $('#numkeyboardInput');
            var inputText = o.val() + $(this).text();
            o.val(DigitsFormat(inputText));
            o.focus();
        }).attr("unselectable", "on");

        $('.keyboard_button').bind("click", function () {
            $('#textkeyboardInput').focus();
            $('#textkeyboardInput').val($('#textkeyboardInput').val() + $(this).text());
            $('#textkeyboardInput').focus();
        }).attr("unselectable", "on");
    });
    currentInput;
    function showKeyBoard(obj, type) {
        if ($(obj).attr("keyboardmode") == "numeric") {
             type = "num";
         }
        $('#backing_fon').css('display', 'block');
      
        $('#backing').css('display', 'block');
        $('#' + type + 'keyboard').css('display', 'block');
       // $('#' + type + 'keyboardInput').val($(obj).val());
        //////////////////////////////////////

        var tagname = document.getElementById($(obj).attr('id')).tagName.toLowerCase();
 
        if (tagname == 'div' || tagname == 'span') {
            $('#' + type + 'keyboardInput').val($(obj).html());
        } else {
            $('#' + type + 'keyboardInput').val($(obj).val());
        }
        //////////////////////////////////////
        $('#' + type + 'keyboardInput').focus();
         currentInput = obj;
        $('#' + type + 'keyboardInput').focus();
    }
    function hideKeyBoard() {
        $('.keyboard').css('display', 'none');
        $('#backing').css('display', 'none');
        $('#backing_fon').css('display', 'none');
    }

    function SaveTEXTKeyValue(obj) {

        $(obj).unbind('click');
        //$(currentInput).val($('#textkeyboardInput').val());
        hideKeyBoard();

        var tagname = document.getElementById($(currentInput).attr('id')).tagName.toLowerCase();
        if (tagname == 'div' || tagname == 'span') {
            $(currentInput).html($('#textkeyboardInput').val());
        } else {
            $(currentInput).val($('#textkeyboardInput').val());
        }

        if ($(currentInput).attr('keyboardcopyval')) {
            $($(currentInput).attr('keyboardcopyval')).each(function () {
                var tagname = document.getElementById($(this).attr('id')).tagName.toLowerCase();
                if (tagname == 'div' || tagname == 'span') {
                    $(this).html($('#textkeyboardInput').val());
                } else {
                    $(this).val($('#textkeyboardInput').val());
                }
            });
        }
 
    }
    function SaveNUMKeyValue() {
       // $(currentInput).val($('#numkeyboardInput').val());
     
        
        hideKeyBoard();



        var tagname = document.getElementById($(currentInput).attr('id')).tagName.toLowerCase();
        if (tagname == 'div' || tagname == 'span') {
            $(currentInput).html($('#numkeyboardInput').val());
        } else {
            $(currentInput).val($('#numkeyboardInput').val());
        }
         
        if ($(currentInput).attr('keyboardcopyval')) {
            $($(currentInput).attr('keyboardcopyval')).each(function () {
                var tagname = document.getElementById($(this).attr('id')).tagName.toLowerCase();
                if (tagname == 'div' || tagname == 'span') {
                    $(this).html($('#numkeyboardInput').val().replace(/\s+/g, ''));
                } else {
                    $(this).val($('#numkeyboardInput').val().replace(/\s+/g, ''));
                }
            });
        }
    }
</script>
