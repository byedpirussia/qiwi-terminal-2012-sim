<html>
<head>
	<title>Online_Auth_Error</title>
	<meta http-equiv="content-type" content="text/html; charset=windows-1251" />
	<meta http-equiv="refresh" content="180; URL=./index.html" />
	<link rel="stylesheet" href="./css/online_auth_error.css" type="text/css" />
	<link rel="stylesheet" href="./css/gr_prv.css" type="text/css" />
	<script type="text/javascript" src="./js/engine/utils.js"></script>
	<script type="text/javascript" src="./js/engine/storage.js"></script>
	<script src="./js/lang/str_kaz.js" type="text/javascript"></script>
	<script src="./js/lang/str_rus.js" type="text/javascript"></script>
	<script type="text/javascript">
	
	function start (){
	   var sLang = storage.get("language");
       if(sLang == "rus")
       {
       document.getElementById('btn_back').style.display = "block";
       document.getElementById('btn_menu').style.display = "block";
       }
       else {
       document.getElementById('btn_back_kaz').style.display = "block";
       document.getElementById('btn_menu_kaz').style.display = "block";
       }
       }

        function onMenuBtnClick(sBtn)
        {
            switch (sBtn)
            {
                case "BACKWARD":
                    var oPayInfo = Object.deserialize(storage.get("pay_info"));
                    if($isNoU(oPayInfo))
                    {
                        document.location.href = "./index.html";
                        return;
                    }
                    
                    if( ('isCellular' in oPayInfo && oPayInfo.isCellular && $bool(oPayInfo.isCellular))
                    	||
                    	(oPayInfo.tag && oPayInfo.tag.indexOf('ranges') > -1)
                    ){
                        document.location.href = "./cellular.html";
                    }
                    else
                    {
                        document.location.href = "./provider.html";
                    }
                break;
                case "MENU":
                    document.location.href = "./index.html";
                break;
            }
             }

       function onBackBtnClick() {
           var oPayInfo = Object.deserialize(storage.get("pay_info"));
           if (oPayInfo != null || oPayInfo != "undefined") {
               storage.put("provider", oPayInfo.prvId);
               storage.put("pay_info", "null");
               document.location.href = "./provider.html";
           }
           else
               document.location.href = "./main.html";
       };
       function onMenuBtnClick() {
           document.location.href = "./index.html";
       };
	</script>
</head>
<body onload="start();">
<div id="content">
    <div style="height: 160px"></div>
    <div id="img"><img src="./img/ui/online_auth_error.gif"/></div>
    <div id="msg">
    <form id="ff" name="ff" method="post" action="#">
    <input id="auth_msg" name="auth_msg" class="inp w_100 t_a_c" type="text" value="" />
    </form>
    </div>
</div>
	        <div class="bottom-button-left" id="btn_back" style="display: none"><img src="./img/ui/navigation/back_rus.gif" onclick="onMenuBtnClick('BACKWARD');" /></div>
			<div class="bottom-button-center" id="btn_menu" style="display: none;"><img src="./img/ui/navigation/menu_rus.gif" onclick="onMenuBtnClick('MENU');" /></div>
			<div class="bottom-button-left" id="btn_back_kaz" style="display: none"><img src="./img/ui/navigation/back_kaz.gif" onclick="onMenuBtnClick('BACKWARD');" /></div>
			<div class="bottom-button-center" id="btn_menu_kaz" style="display: none;"><img src="./img/ui/navigation/menu_kaz.gif" onclick="onMenuBtnClick('MENU');" /></div>
</body>
</html>
