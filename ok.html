<html>
<head>
	<title>Validate_Confirm</title>
	<meta http-equiv="content-type" content="text/html; charset=windows-1251" />
	<meta http-equiv="pragma" content="no-cache" />
	<meta http-equiv="refresh" content="20; URL=./index.html" />
	<link rel="stylesheet" href="./css/ok.css" type="text/css" />
	<script type="text/javascript" src="./js/engine/utils.js"></script>
	<script type="text/javascript" src="./js/engine/base.js"></script>
	<script type="text/javascript" src="./js/engine/storage.js"></script>
	<script type="text/javascript" src="./js/engine/advert.js"></script>
	<script type="text/javascript" src="./advert_content.js"></script>
	<script type="text/javascript" src="./advert_content_kz.js"></script>
	<script type="text/javascript">

        function init() {
        
     
        var sLang = storage.get("language");


        if(sLang == "rus"){
       $("btn_center_rus").style.display = "block";
       document.getElementById('title').style.background = 'url("./img/ui/field/ok_rus.gif") no-repeat center';

       
 }
       else {
       $("btn_center_kaz").style.display = "block";
       document.getElementById('title').style.background = 'url("./img/ui/field/ok_kaz.gif") no-repeat center';
       


       }
        
            var oPayInfo = Object.deserialize(storage.get("pay_info"));
            var advert = new AdvertClass("Ok");
            if ($isNoU(oPayInfo)) {
                document.location.href = "./index.html";
            }
            displayPayInfo(oPayInfo);
            advert.placeAdv();
	    new CInnerShadow($('btn_center_rus').getElementsByTagName('img')[0], { saturation: 1, brightness: 200 });
	    new CInnerShadow($('btn_center_kaz').getElementsByTagName('img')[0], { saturation: 1, brightness: 200 });
        }

        function displayPayInfo(oInfo) {
            if (isCorrect(oInfo.account)) {
                $("num_inp").value = oInfo.account == '0000000000' ? 'Номер не указан' : oInfo.account;
            }
            else {
                $("num_inp").value = "";
            }
            if (isCorrect(oInfo.summ)) {
                $("summ_txt").innerHTML = oInfo.summ;
            }
            else {
                $("summ_txt").innerHTML = "";
            }
        }

        function isCorrect(s) {
            return (!$isNoU(s) && s.is(String) && s.length > 0);
        }

        function onMenuBtnClick(sBtn) {
            switch (sBtn) {
                case "FORWARD":
                    document.location.href = "./index.html";
                    break;
            }
        }

	</script>
</head>
<body onload="init();">
<bgsound src="./sound/kvitanc.wav" loop="1"></bgsound>
<form id="ff" name="ff" method="post" action="#">
        <div id="content">
            <div id="contener1">
                <div class="advert1" id="advert_1"></div>
                <div class="advert1" id="advert_2"></div>
            </div>
            <div id="contener2" >
            <div id="qiwi_logo"></div>
                
            
            <div id="title"  style=" width: 940px; height: 324px; float: left; margin-left: 42px;">
            <div id="num_txt"><input id="num_inp" name="num_inp" type="text" value="" /></div>
                    <div id="contener_summ">
                    <div id="summ_txt"></div>
                    </div>
               
            </div></div>
            
            
            <div id="contener3">
                <div class="advert2" id="advert_3"></div>
                <div class="advert2" id="advert_4"></div>
                <div class="advert2" id="advert_5"></div>
            </div>
            <div id="bottom_menu">
                <div id="btn_left" class="bottom-button-left"></div>
                
                
                <div id="btn_center_rus" style="display:none;" class="bottom-button-center">
                    <img alt="" src="./img/ui/navigation/menu_rus.gif" onclick="onMenuBtnClick('FORWARD');" />
                </div>
                
                <div id="btn_center_kaz" style="display:none;" class="bottom-button-center">
                <img alt="" src="./img/ui/navigation/menu_kaz.gif" onclick="onMenuBtnClick('FORWARD');" />
                </div>
                
                
                <div id="btn_right" class="bottom-button-right"></div>
            </div>
        </div>
</form>
</body>
</html>
