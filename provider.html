	<script type="text/javascript">
var js = null;
var head = null;

function init() {
	var prvId = storage.get("provider");
	if(prvId)
	{
		getScript("./config/" + storage.get("language") + "/" + storage.get("provider") + ".js", start);
	}
	else
	{
	//        ===== Convert Custom =====
	    var oCastom = Object.deserialize(storage.get("custom_provider"));
	    if (oCastom == null)
		    top.location.href = "./terminal.html";
		else {
		    (new CJsDataProvider).modifyProvider(oCastom);
		    var page = newObject(CProviderPage, null, null, null, "page", "content", oCastom);
            page.render();
		}
	}
}

function start() {
    var oProvider = null;
    try {
        oProvider = window.UIProvider.clone();
        (new CJsDataProvider).modifyProvider(oProvider);
    }
    catch (e) {
//    	console.debug(e);
    }
    
    if (head && js)
        head.removeChild(js);
    
    if ($isNoU(oProvider)) {
        document.location.href = "./terminal.html";
    }
    else {
        var page = newObject(CProviderPage, null, null, null, "page", "content", oProvider);
        page.render();
		window.PAGE = page;
    }
}
    </script>
